[project]
name = "copper-market-intelligence"
version = "0.1.0"
description = "Copper Market Intelligence & Forecasting Platform (scaffold - Stage 1)"
readme = "README.md"
requires-python = ">=3.11"
authors = [ { name = "", email = "" } ]

dependencies = [
    "pandas>=2.0",
    "numpy>=1.25",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "ruff>=0.12",
    "black>=23.0",
]
data = [
    "yfinance>=0.2"
]

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.ruff]
line-length = 88
# Top-level ruff settings (non-lint metadata). Per-tool lints live under [tool.ruff.lint].
# Keep line-length here for backward compatibility.
# The actual lint selection and per-file-ignores are configured under [tool.ruff.lint].

# Per-path pragmas: keep `src/` strict, relax some rules for `scripts/`, and
# allow common test patterns in `tests/` while preserving meaningful checks.
# Use `per-file-ignores` to scope rule relaxations by path/glob.

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
# Per-path pragmas: keep `src/` strict, relax some rules for `scripts/`, and
# allow common test patterns in `tests/` while preserving meaningful checks.
per-file-ignores = { "tests/**" = ["S101", "ANN", "D"], "scripts/**" = ["T201", "BLE001", "PLC0415", "SLF001", "E501"] }


